services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Apicola_Motupe_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: Apicola_Motupe_db
    environment:
      MYSQL_DATABASE: bd_apicola_motupe
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: